name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: |
          python3 tools/build_web.py
          mkdir -p www/lib/addons
          cp node_modules/three/build/three.module.js www/lib/
          cp -r node_modules/three/examples/jsm/postprocessing node_modules/three/examples/jsm/shaders www/lib/addons/
          cp node_modules/peerjs/dist/peerjs.min.js www/lib/

      - name: Create Android project
        run: |
          npx cap add android
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          cp android-overrides/java/MainActivity.java android/app/src/main/java/com/station9/game/MainActivity.java
          cp -r android-overrides/res/* android/app/src/main/res/
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Station9.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Station9-apk
          path: Station9.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Station9.apk \
            --title "Station 9 – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Station9.apk auf dem Handy herunterladen und installieren." \
            --target "$GITHUB_SHA"
